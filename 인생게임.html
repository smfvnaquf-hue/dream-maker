<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꿈 메이커 인생게임 – 나의 미래 직업 찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 기본 색상 변수 및 다크모드 지원 */
:root {
  --bg: #fff8e7;
  --card: #ffffff;
  --ink: #2b2a4c;
  --sub: #6b6a8a;
  --line: #e4dcc4;
  --pri: #3b6cff;
  --pri-ink: #fff;
  --sun: #ffc533;
  --c1: #f5a623;
  --c2: #3aa0ff;
  --c3: #b36bff;
  --c4: #e85d9a;
  --c5: #ff6b4a;
  --c6: #3fb86f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a3a;
    --card: #27254d;
    --ink: #fff4d6;
    --sub: #b5b2dc;
    --line: #3d3b6e;
    --pri: #7d9bff;
    --pri-ink: #14123a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a3a;
  --card: #27254d;
  --ink: #fff4d6;
  --sub: #b5b2dc;
  --line: #3d3b6e;
  --pri: #7d9bff;
  --pri-ink: #14123a;
}

/* 기본 레이아웃 및 타이포그래피 */
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 18px;
  line-height: 1.55;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
main { max-width: 920px; margin: 0 auto; padding: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }

/* 카드 및 버튼 스타일 */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 20px; }
.btn { background: var(--pri); color: var(--pri-ink); border: 0; border-radius: 14px; padding: 12px 26px; font-size: 20px; transition: transform 0.15s; }
.btn:hover { transform: translateY(-2px); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.center { text-align: center; }

h1 { font-size: clamp(32px, 7vw, 50px); margin: 4px 0; line-height: 1.15; }
.sub { color: var(--sub); max-width: 34em; margin: 6px auto 16px; }
input[type=text] {
  font: inherit;
  font-size: 20px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  width: min(260px, 100%);
  text-align: center;
}

/* 캐릭터 선택 및 아바타 박스 */
.gender { display: flex; gap: 14px; justify-content: center; margin: 14px 0; }
.gbtn {
  background: var(--bg);
  border: 3px solid var(--line);
  border-radius: 20px;
  padding: 8px 10px 10px;
  width: 150px;
  font-size: 19px;
  transition: border-color .15s, transform .15s;
}
.gbtn.on { border-color: var(--pri); transform: translateY(-4px); }
.gbtn svg { width: 100%; height: auto; display: block; }

.avbox { border-radius: 18px; padding: 6px; display: flex; justify-content: center; position: relative; animation: pop .5s ease-out; }
.avbox svg { width: 100%; max-width: 200px; height: auto; }
.avbox.big svg { max-width: 270px; }
.fx { position: absolute; font-size: 30px; animation: float 3s ease-in-out infinite; }

@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes float { 50% { transform: translateY(-8px); } }

/* 게임 진행 화면 레이아웃 */
.game { display: grid; grid-template-columns: 230px 1fr; gap: 16px; align-items: start; }
@media (max-width: 720px) {
  .game { grid-template-columns: 1fr; }
  .me { position: static !important; }
  .me .avbox svg { max-width: 150px; }
}
.me { text-align: center; position: sticky; top: 8px; padding: 14px; }
.me h2 { margin: 6px 0 0; font-size: 20px; }
.stage { color: var(--sub); font-size: 15px; margin-bottom: 8px; }

/* 흥미 유형 스탯 바 */
.stat { display: grid; grid-template-columns: 70px 1fr 24px; gap: 6px; align-items: center; font-size: 13px; text-align: left; margin: 4px 0; }
.bar { height: 10px; border-radius: 8px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 8px; transition: width .5s; }

/* 타임라인 및 질문/선택지 */
.tl { display: flex; gap: 4px; margin-bottom: 14px; }
.tl span { flex: 1; text-align: center; font-size: 12px; color: var(--sub); border-top: 6px solid var(--line); padding-top: 2px; }
.tl span.done { border-color: var(--sun); }
.tl span.now { border-color: var(--pri); color: var(--ink); }
.sit { font-size: 54px; line-height: 1.1; }
.q { font-size: clamp(20px, 4.5vw, 25px); margin: 6px 0 16px; line-height: 1.45; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 13px 16px;
  font-size: 18px;
  transition: border-color .15s, transform .1s;
}
.opt:hover { border-color: var(--pri); }
.opt.pick { border-color: var(--pri); background: var(--card); transform: scale(.98); }

/* 결과 화면 스타일 */
.badge { display: inline-block; background: var(--sun); color: #2b2a4c; border-radius: 20px; padding: 2px 14px; font-size: 16px; }
.res h2 { font-size: clamp(28px, 6vw, 40px); margin: 6px 0; }
.res p { max-width: 36em; margin: 10px auto; }
.box { text-align: left; max-width: 520px; margin: 14px auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.chips span { border: 2px solid var(--line); border-radius: 14px; padding: 2px 12px; font-size: 15px; }
.more { max-width: 560px; margin: 16px auto 0; text-align: left; border-top: 2px dashed var(--line); padding-top: 12px; }
.more h3 { font-size: 18px; margin: 0 0 6px; }
.more div { margin: 4px 0; font-size: 16px; }
.more small { color: var(--sub); }
.acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.note { color: var(--sub); font-size: 15px; }
.note a { color: var(--pri); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

  if (hat === "helmet") x += '<path d="M' + (cx - r - 4) + ',' + (hy - 2) + ' A' + (r + 4) + ',' + (r + 4) + ' 0 0 1 ' + (cx + r + 4) + ',' + (hy - 2) + ' Z" fill="#e53935"/><rect x="' + (cx - r - 8) + '" y="' + (hy - 4) + '" width="' + (2 * r + 16) + '" height="5" rx="2" fill="#b71c1c"/><circle cx="' + cx + '" cy="' + (hy - r * .6) + '" r="4" fill="#ffd54f"/>';
  if (hat === "beret") x += '<ellipse cx="' + (cx + 4) + '" cy="' + (hy - r + 2) + '" rx="' + (r * .95) + '" ry="9" fill="#6c3fb5" transform="rotate(-8 ' + cx + ' ' + (hy - r) + ')"/><circle cx="' + (cx + 2) + '" cy="' + (hy - r - 6) + '" r="3" fill="#6c3fb5"/>';
  if (hat === "nurse") x += '<rect x="' + (cx - r * .6) + '" y="' + (hy - r - 5) + '" width="' + (r * 1.2) + '" height="11" rx="2" fill="#fff" stroke="#ddd"/><rect x="' + (cx - 1.5) + '" y="' + (hy - r - 3) + '" width="3" height="7" fill="#e53935"/><rect x="' + (cx - 3.5) + '" y="' + (hy - r - 1) + '" width="7" height="3" fill="#e53935"/>';
  if (hat === "phones") x += '<path d="M' + (cx - r - 2) + ',' + (hy + 2) + ' A' + (r + 2) + ',' + (r + 2) + ' 0 0 1 ' + (cx + r + 2) + ',' + (hy + 2) + '" fill="none" stroke="#333" stroke-width="4"/><circle cx="' + (cx - r - 2) + '" cy="' + (hy + 5) + '" r="6" fill="#333"/><circle cx="' + (cx + r + 2) + '" cy="' + (hy + 5) + '" r="6" fill="#333"/>';
  if (hat === "cap") x += '<path d="M' + (cx - r - 1) + ',' + (hy - 2) + ' A' + (r + 1) + ',' + (r + 1) + ' 0 0 1 ' + (cx + r + 1) + ',' + (hy - 2) + ' Z" fill="#222"/><rect x="' + (cx - r - 10) + '" y="' + (hy - 4) + '" width="' + (r + 12) + '" height="5" rx="2" fill="#222"/>';
  if (J) x += '<text x="' + (cx + tw / 2 + 4) + '" y="' + (ay + 8) + '" font-size="38">' + J.pr + "</text>";

  return '<svg viewBox="0 0 200 250" role="img" aria-label="캐릭터">' + x + "</svg>";
}

function box(g, s, jn, big) {
  var b = jn ? JO[jn].b : BG[s];
  return '<div class="avbox' + (big ? " big" : "") + '" style="background:linear-gradient(180deg,' + b[0] + "," + b[1] + ')">' + av(g, s, jn) + "</div>";
}

// 6. 게임 상태 관리 및 화면 렌더링 함수들
function fresh(n, g) {
  S = { name: n, g: g, i: 0, sc: { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 } };
}

// 시작 화면
function home() {
  var gsel = null;
  app.innerHTML = '<div class="card center" style="padding:28px 16px"><div style="font-size:64px">🌱</div><h1>꿈 메이커 인생게임</h1><p class="sub">아기에서 어른까지 인생의 여러 순간에 내가 고른 선택이 쌓여 나의 미래 직업이 정해져요. 먼저 캐릭터를 골라 보세요!</p><div class="gender"><button class="gbtn" data-g="m">' + av("m", 2) + '남자 아이</button><button class="gbtn" data-g="f">' + av("f", 2) + '여자 아이</button></div><input type="text" id="nm" maxlength="8" placeholder="내 이름" aria-label="내 이름"><p class="note" id="hint">&nbsp;</p><button class="btn" id="go">인생 시작하기</button></div>';
  [].forEach.call(app.querySelectorAll(".gbtn"), function(b) {
    b.onclick = function() {
      gsel = b.dataset.g;
      [].forEach.call(app.querySelectorAll(".gbtn"), function(x) { x.classList.toggle("on", x === b); });
    };
  });
  document.getElementById("go").onclick = function() {
    if (!gsel) { document.getElementById("hint").textContent = "먼저 캐릭터를 골라 주세요."; return; }
    fresh(document.getElementById("nm").value.trim() || "꿈나무", gsel);
    grow(0);
  };
}

// 연령 성장 안내 화면
function grow(s) {
  var d = G[s], last = s === 7;
  app.innerHTML = '<div class="card center">' + box(S.g, s, null, true) + '<h2 style="margin:10px 0 0">' + d[0] + " · " + d[1] + '</h2><p class="sub">' + (last ? esc(S.name) + "은(는) 열심히 자라서 어른이 되었어요. 어떤 직업을 갖게 되었을까요?" : esc(S.name) + "은(는) " + d[1] + "이(가) 되었어요. " + d[2]) + '</p><button class="btn" id="nx">' + (last ? "내 직업 확인하기" : "이야기 시작") + "</button></div>";
  var b = document.getElementById("nx");
  b.focus();
  b.onclick = last ? result : ask;
}

// 질문 및 선택 화면
function ask() {
  busy = false;
  var sc = SC[S.i], st = stg(S.i), opts = shuffle(sc[2]);
  var tl = G.slice(0, 7).map(function(d, i) { return '<span class="' + (i < st ? "done" : i === st ? "now" : "") + '">' + d[0] + "</span>"; }).join("");
  var bars = KEYS.map(function(k) { return '<div class="stat"><span>' + T[k].e + " " + T[k].s + '</span><div class="bar"><i style="width:' + Math.min(100, S.sc[k] * 100 / 32) + "%;background:" + T[k].c + '"></i></div><b>' + S.sc[k] + "</b></div>"; }).join("");

  app.innerHTML = '<div class="game"><aside class="card me">' + box(S.g, st, null) + "<h2>" + esc(S.name) + '</h2><div class="stage">' + G[st][0] + " · " + G[st][1] + "</div>" + bars + '</aside><section class="card"><div class="tl" aria-label="인생 타임라인">' + tl + '</div><div class="sit">' + sc[0] + '</div><p class="q">' + sc[1] + '</p><div class="opts">' + opts.map(function(o, i) { return '<button class="opt" data-i="' + i + '">' + o[0] + "</button>"; }).join("") + "</div></section></div>";

  [].forEach.call(app.querySelectorAll(".opt"), function(b) {
    b.onclick = function() {
      if (busy) return;
      busy = true;
      b.classList.add("pick");
      var c = opts[+b.dataset.i][1];
      S.sc[c[0]] += 2;
      if (c[1]) S.sc[c[1]] += 1;
      setTimeout(function() {
        S.i++;
        if (S.i >= SC.length) grow(7);
        else if (first(S.i)) grow(stg(S.i));
        else ask();
      }, 260);
    };
  });
}

// 최종 결과 화면
function result() {
  var r = KEYS.map(function(k, i) { return { k: k, i: i, v: S.sc[k] }; }).sort(function(a, b) { return b.v - a.v || a.i - b.i; });
  var a = T[r[0].k], b = T[r[1].k], main = a.j[r[1].i % 3], more = a.j.filter(function(x) { return x !== main; }).concat([b.j[r[0].i % 3]]), jo = JO[main[0]];
  var list = more.map(function(j) { return "<div>" + j[1] + " <b>" + j[0] + "</b> <small>" + j[2] + "</small></div>"; }).join("");
  var all = KEYS.map(function(k) { return '<div class="stat" style="grid-template-columns:110px 1fr 24px;font-size:15px"><span>' + T[k].e + " " + T[k].n + '</span><div class="bar"><i style="width:' + Math.min(100, S.sc[k] * 100 / 32) + "%;background:" + T[k].c + '"></i></div><b>' + S.sc[k] + "</b></div>"; }).join("");
  var fx = Array.from(jo.fx).length ? jo.fx.match(/\p{Extended_Pictographic}\uFE0F?/gu) : [], pos = ["left:6%;top:14%", "right:6%;top:24%", "left:10%;bottom:20%"];
  var fxh = (fx || []).slice(0, 3).map(function(e, i) { return '<span class="fx" style="' + pos[i] + ';animation-delay:' + i * .6 + 's">' + e + "</span>"; }).join("");

  app.innerHTML = '<div class="card res center"><span class="badge">' + esc(S.name) + "의 30살, 나의 직업</span>" + '<div style="position:relative;max-width:360px;margin:10px auto 0">' + box(S.g, 7, main[0], true) + fxh + "</div><h2>" + main[1] + " " + main[0] + "</h2><p><b>" + jo.sc + "</b></p><p>" + main[2] + "</p><p>나의 대표 흥미는 <b>" + a.e + " " + a.n + "</b>, 그다음은 <b>" + b.e + " " + b.n + "</b>이에요.<br>" + a.t + '</p><div class="chips">' + a.k.map(function(x) { return "<span>" + x + "</span>"; }).join("") + '</div><div class="box">' + all + '</div><div class="more"><h3>이런 직업도 어울려요</h3>' + list + '</div><p class="note">이 결과는 재미로 보는 놀이예요. 진짜 검사는 <a href="https://www.career.go.kr" target="_blank" rel="noopener">커리어넷</a> 주니어의 진로흥미탐색에서 해 볼 수 있어요.</p><div class="acts"><button class="btn" id="re">다른 인생 살아 보기</button><button class="btn ghost" id="hm">처음으로</button></div></div>';

  document.getElementById("re").onclick = function() { fresh(S.name, S.g); grow(0); };
  document.getElementById("hm").onclick = home;
}

// 앱 초기화
home();
</script>
</body>
</html>
